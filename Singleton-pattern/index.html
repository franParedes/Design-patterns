<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Singleton - Westeros Wall</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 400px; }
        h2 { margin-top: 0; color: #2c3e50; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #333; }
        input { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 12px; margin-top: 20px; background-color: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #1a252f; }
        .btn-ver { background-color: #2980b9; }
        .btn-ver:hover { background-color: #1c5980; }
        .result { margin-top: 20px; padding: 15px; background: #e8f8f5; border-left: 4px solid #1abc9c; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>El Muro (Singleton JS)</h2>
    <label for="height">Altura del Muro (metros):</label>
    <input type="number" id="height" placeholder="Ej. 200">

    <label for="commander">Comandante a cargo:</label>
    <input type="text" id="commander" placeholder="Ej. Jon Snow">

    <button onclick="guardarEnBD()">Actualizar Muro y Guardar</button>
    <button class="btn-ver" onclick="cargarDeBD()">Ver Datos en MySQL</button>

    <div id="display" class="result"></div>
</div>

<script>
    // Patrón Singleton en JavaScript
    class Wall {
        constructor() {
            if (Wall._instance) {
                return Wall._instance;
            }
            this.height = 0;
            this.commander = "";
            Wall._instance = this;
        }
        setProperties(height, commander) {
            this.height = height;
            this.commander = commander;
        }
        static getInstance() {
            if (!Wall._instance) {
                Wall._instance = new Wall();
            }
            return Wall._instance;
        }
    }

    function guardarEnBD() {
        const height = document.getElementById('height').value;
        const commander = document.getElementById('commander').value;

        if (!height || !commander) {
            alert("Completa todos los campos.");
            return;
        }

        const theWall = Wall.getInstance();
        theWall.setProperties(height, commander);

        // Preparamos el JSON exacto que espera el servidor Java
        const datosParaBD = {
            altura: parseInt(theWall.height),
            comandante: theWall.commander
        };
        
        // Petición POST al servidor Java
        fetch('http://localhost:5000/api/muro', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datosParaBD)
        })
        .then(response => {
            if(response.ok) alert("Instancia procesada por Java y guardada en MySQL.");
            document.getElementById('height').value = '';
            document.getElementById('commander').value = '';
        })
        .catch(error => alert("Error al conectar con el servidor Java."));
    }

    function cargarDeBD() {
        // Petición GET al servidor Java
        fetch('http://localhost:5000/api/muro')
        .then(response => response.json())
        .then(data => {
            if (data.altura) {
                const display = document.getElementById('display');
                display.style.display = 'block';
                display.innerHTML = `<strong>Datos actuales en MySQL:</strong><br><br>
                                     <strong>Altura:</strong> ${data.altura} m<br>
                                     <strong>Comandante:</strong> ${data.comandante}`;
            } else {
                alert("No hay datos en la base de datos.");
            }
        })
        .catch(error => alert("Asegúrate de que ServidorAPI.java esté corriendo en IntelliJ."));
    }
</script>
</body>
</html>
